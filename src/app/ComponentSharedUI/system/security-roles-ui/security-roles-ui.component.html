<section class="roles-panel">
  <div *ngIf="loading" class="state-msg loading">Loading permissions…</div>
  <div *ngIf="error" class="state-msg error">{{ error }}</div>

  <form (ngSubmit)="submitData()" *ngIf="!loading && !error">
    <div class="tree-section" *ngFor="let section of securityRoles">
      <div class="section-head">
        <span class="dot"></span>
        <h4>{{ section.desc_code | titlecase }}</h4>
        <span class="badge" *ngIf="selectedCount(section) as n">{{ n }} selected</span>
      </div>

      <div class="menu-card" *ngFor="let item of section.datas">
        <details [open]="item.access">
          <summary>
            <mat-checkbox [checked]="item.access" (change)="onMenuChange(item, $event)"
              (click)="$event.stopPropagation()">
              {{ item.description }}
            </mat-checkbox>
            <span class="chevron" *ngIf="item.submenu?.length">▾</span>
          </summary>

          <ul class="sub-list" *ngIf="item.submenu?.length">
            <li *ngFor="let sub of item.submenu">
              <mat-checkbox [checked]="sub.access" (change)="onSubmenuChange(item, sub, $event)">
                {{ sub.description }}
              </mat-checkbox>
            </li>
          </ul>
        </details>
      </div>
    </div>

    <div class="state-msg info" *ngIf="securityRoles.length === 0">No data available</div>

    <div class="actions">
      <button mat-raised-button color="primary" type="submit">Update Access</button>
    </div>
  </form>
</section>
