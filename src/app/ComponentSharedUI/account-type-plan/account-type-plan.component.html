<h1 class="title">Choose Your Plan</h1>
<p class="subtitle">Select the best plan that suits your needs.</p>

<div class="plan-card">
  <div class="plan-box" *ngFor="let plan of plans" [ngClass]="plan.plan_name?.toLowerCase() + '-plan'">
    <div class="plan-badge" [ngClass]="plan.button_color">
      {{ plan.tag || 'PLAN' }}
    </div>

    <h2>{{ plan.plan_name }}</h2>

    <p class="plan-desc">
      {{ plan.description }}
    </p>

    <div class="price">
      ₱{{ plan.price }}
      <span>/ {{ plan.tagmonthYear }}</span>
    </div>

    <ul>
      <li *ngFor="let f of planFeatures?.[plan.planId]">
        ✔ {{ f.feature_name }}
      </li>
    </ul>

    <button mat-raised-button [color]="plan.button_color || 'primary'" (click)="selectPlan(plan)">
      {{ plan.button_name || 'Choose Plan' }}
    </button>
  </div>
</div>
