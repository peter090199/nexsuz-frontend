<section class="section">
    <div class="search-container">
        <mat-form-field appearance="outline" class="premium-search">
            <mat-icon matPrefix>search</mat-icon>
            <input matInput placeholder="Search jobs..." [(ngModel)]="searchText" (keyup)="onSearch()"
                (keyup.enter)="onEnter()">
            <button *ngIf="searchText" matSuffix mat-icon-button (click)="clearSearch()">
                <mat-icon>close</mat-icon>
            </button>
        </mat-form-field>
    </div>

    <div class="text-center mt-5" *ngIf="isLoading">
        <p style="text-align: center;">Loading jobs...</p>
    </div>

    <div class="jobs-grid" *ngIf="!isLoading">
        <div class="job-card" *ngFor="let job of filteredJobs" (click)="selectJob(job)">
            <div class="card-top-bar"></div>

            <div class="card-body">
                <div class="job-header">
                    <div class="job-logo">
                        <img [src]="job.image" [alt]="job.job_position" (error)="job.image = placeholderImg">
                    </div>
                    <span class="work-type-badge" [ngClass]="job.typeClass">{{ job.work_type }}</span>
                </div>

                <h3 class="job-name">{{ job.job_name }}</h3>

                <p class="job-position"><i class="fas fa-building"></i> {{ job.job_position }}</p>
                <p class="location"><i class="fas fa-map-marker-alt"></i> {{ job.location }}</p>
                <p class="salary"><i class="fas fa-money-bill-wave"></i> {{ formatSalary(job) }}</p>

                <div class="job-footer">
                    <button class="apply-btn" (click)="openJobApply(job); $event.stopPropagation()">
                        Apply Now
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-5" *ngIf="!isLoading && filteredJobs.length === 0">
        <h3>No jobs found.</h3>
        <p>Try searching with another keyword.</p>
    </div>

    <div class="text-center mt-5" *ngIf="!isLoading && hasMore && !searchText">
        <button class="browse-btn" (click)="loadMore()" [disabled]="isLoadingMore">
            {{ isLoadingMore ? 'Loading...' : 'Load More Jobs' }}
        </button>
    </div>
</section>
