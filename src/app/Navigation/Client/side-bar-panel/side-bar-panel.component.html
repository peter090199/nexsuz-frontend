<mat-sidenav-container class="layout-container">
  <!-- ================= SIDEBAR ================= -->
  <mat-sidenav mode="side" [(opened)]="sidebarOpen" class="sidebar" [fixedInViewport]="true" [fixedTopGap]="0">
    <div class="sidebar-inner">

      <div class="logo-section">
        <app-app-logo></app-app-logo>
      </div>

      <!-- MENU (scrollable) -->
      <mat-nav-list class="menu-list">
        <ng-container *ngFor="let item of menuItems">

          <!-- NORMAL MENU -->
          <a *ngIf="!item.submenus?.length" mat-list-item [routerLink]="item.route" routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }" class="menu-item">
            <div class="menu-left">
              <!-- <mat-icon *ngIf="item.icon">{{ item.icon }}</mat-icon> -->
              <span class="menu-label">{{ item.label }}</span>
            </div>
          </a>

          <!-- SUBMENU -->
          <div *ngIf="item.submenus?.length" class="submenu-wrapper">
            <a mat-list-item class="menu-item" (click)="toggleSubmenu(item)">
              <div class="menu-left">
                <span class="menu-label">{{ item.label }}</span>
              </div>
              <mat-icon class="expand-icon">
                {{ item.expanded ? 'expand_less' : 'expand_more' }}
              </mat-icon>
            </a>

            <div class="submenu" *ngIf="item.expanded">
              <a mat-list-item *ngFor="let sub of item.submenus" [routerLink]="sub.route" routerLinkActive="active-link"
                [routerLinkActiveOptions]="{ exact: true }" class="submenu-item">
                <span class="submenu-label">{{ sub.label || sub.description }}</span>
              </a>
            </div>
          </div>

        </ng-container>
      </mat-nav-list>

      <!-- ============ PROFILE FOOTER (pinned bottom) ============ -->
      <div class="sidebar-footer">
        <button class="profile-footer-btn" disableRipple matRipple [matRippleColor]="'rgba(255,255,255,0.12)'"
          [matMenuTriggerFor]="userMenu" [matTooltip]="profile?.email || 'My Account'" matTooltipPosition="right"
          aria-label="Open account menu">
          <span class="avatar-wrap">
            <img *ngIf="profile?.photo_pic; else defaultAvatar" [src]="profile?.photo_pic" alt="" class="avatar-img" />
            <ng-template #defaultAvatar>
              <span class="avatar-fallback">{{ sharedService.getInitials(profile?.name) }}</span>
            </ng-template>
          </span>


          <span class="profile-sub" *ngIf="profile?.email">{{ profile?.email }}</span>
          <mat-icon class="footer-caret">more_vert</mat-icon>
        </button>
      </div>

    </div>
  </mat-sidenav>

  <!-- ================= MAIN CONTENT ================= -->
  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      <div class="toolbar-left">
        <button *ngIf="isMobile" mat-icon-button class="menu-btn" (click)="toggleSidebar()">
          <mat-icon>menu</mat-icon>
        </button>
        <div class="page-info">
          <button mat-button class="back-btn" (click)="sharedService.goBack()">← Back</button>
          <h3>{{ pageTitle }}</h3>
        </div>
      </div>

      <div class="toolbar-right">
        <button mat-icon-button (click)="toggleSearch()">
          <mat-icon>search</mat-icon>
        </button>

        <button mat-icon-button matTooltip="Notifications" (click)="openNotifications()" [matBadge]="unreadCount"
          [matBadgeHidden]="!unreadCount" matBadgeColor="warn">
          <mat-icon>notifications</mat-icon>
        </button>
      </div>
    </mat-toolbar>

    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>

  <!-- ================= SEARCH SIDENAV ================= -->
  <mat-sidenav #searchSidenav position="end" mode="over" class="search-sidenav">
    <app-search></app-search>
  </mat-sidenav>

</mat-sidenav-container>

<!-- USER MENU (template ref is visible anywhere in this file) -->
<mat-menu #userMenu="matMenu" class="sidebar-user-menu" xPosition="after" yPosition="above">
  <a mat-menu-item [routerLink]="sharedService.getClientProfileRoute(profile?.code)">
    <mat-icon color="primary">person</mat-icon>
    <span>Profile</span>
  </a>

  <button mat-menu-item (click)="getsettingsUrl()">
    <mat-icon color="primary">settings</mat-icon>
    <span>Settings</span>
  </button>

  <button mat-menu-item (click)="sharedService.onLogout()">
    <mat-icon color="warn">logout</mat-icon>
    <span>Logout</span>
  </button>
</mat-menu>
